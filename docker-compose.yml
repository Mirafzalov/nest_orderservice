services:

  postgres:
    image: postgres:17
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB" ]
      interval: 120s
      timeout: 10s
      retries: 5
      start_period: 10s

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  rabbit:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 120s
      timeout: 10s
      retries: 5
      start_period: 10s

  nest1:
    build:
      context: .
      dockerfile: apps/order_service/Dockerfile
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/health" ]
      interval: 120s
      timeout: 10s
      retries: 5
      start_period: 10s
    env_file:
      - .env
    container_name: order_service
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_started
      rabbit:
        condition: service_healthy

  nest2:
    build:
      context: .
      dockerfile: apps/payment-worker/Dockerfile
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/health" ]
      interval: 120s
      timeout: 10s
      retries: 5
      start_period: 10s
    env_file:
      - .env
    container_name: payment-worker
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_started
      rabbit:
        condition: service_healthy

  nest3:
    build:
      context: .
      dockerfile: apps/notification-worker/Dockerfile
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/health" ]
      interval: 120s
      timeout: 10s
      retries: 5
      start_period: 10s
    env_file:
      - .env
    container_name: notification-worker
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3002:3000"

volumes:
  postgres_data:
