services:

  postgres:
    image: postgres:17
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  rabbit:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      # start_period: 30s

  nest1:
    build:
      context: .
      dockerfile: apps/order_service/Dockerfile
    environment:
      - RABBITMQ_URI=amqp://guest:guest@rabbitmq:5672
    env_file:
      - .env
    container_name: order_service
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_started
      rabbit:
        condition: service_healthy  
      
      

  nest2:
    build:
      context: .
      dockerfile: apps/payment-worker/Dockerfile
    environment:
      - RABBITMQ_URI=amqp://guest:guest@rabbitmq:5672
    container_name: payment-worker
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      rabbit:
        condition: service_healthy

  nest3:
    build:
      context: .
      dockerfile: apps/notification-worker/Dockerfile
    environment:
      - RABBITMQ_URI=amqp://guest:guest@rabbitmq:5672
    container_name: notification-worker
    volumes:
      - .:/app
      - /app/node_modules


volumes:
  postgres_data:
